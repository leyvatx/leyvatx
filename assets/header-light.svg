<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#2f81f7"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="r"><rect width="900" height="260" rx="18"/></clipPath>
<style>
.blob{animation:drift 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.b2{animation-duration:18s;animation-delay:-6s} .b3{animation-duration:22s;animation-delay:-11s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-25px) scale(1.15)}100%{transform:translate(-50px,20px) scale(.9)}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.line{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.2s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style></defs>
<g clip-path="url(#r)">
<rect width="900" height="260" fill="#ffffff"/>
<g filter="url(#b)" opacity=".35">
<circle class="blob" cx="160" cy="70" r="110" fill="#3fb950"/>
<circle class="blob b2" cx="760" cy="60" r="120" fill="#a371f7"/>
<circle class="blob b3" cx="520" cy="240" r="110" fill="#2f81f7"/>
</g>
<rect width="900" height="260" fill="none" stroke="#d1d9e0" rx="18"/>
<g style="font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">
<g class="up d1"><circle class="dot" cx="378" cy="62" r="4" fill="#3fb950"/><text x="460" y="67" font-size="14" fill="#59636e" letter-spacing="2">TIJUANA, B.C. · MÉXICO</text></g>
<text class="up d2" x="450" y="128" font-size="52" font-weight="700" fill="#1f2328" letter-spacing="-1">Efraín Leyva</text>
<line class="line" x1="320" y1="150" x2="580" y2="150" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
<text class="up d3" x="450" y="190" font-size="20" font-weight="600" fill="url(#g)">Software Engineer · Full-Stack Developer</text>
<text class="up d4" x="450" y="222" font-size="14" fill="#59636e">ERPs · Sistemas legados · Machine learning · SaaS en tiempo real</text>
</g></g></svg>